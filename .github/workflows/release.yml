name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rust:
    name: Build Daemon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Sync daemon version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sed -i.bak "s/^version = \".*\"/version = \"${GITHUB_REF_NAME#v}\"/" crates/daemon/Cargo.toml

      - name: Build agentdeckd binary
        run: cargo build --release --target ${{ matrix.target }} -p agentdeck-daemon

      # A stable Developer ID identity keeps macOS privacy grants across upgrades.
      # Missing secrets or an expired certificate fall back to the linker's ad-hoc signature.
      - name: Sign agentdeckd with Developer ID
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "::notice::MACOS_CERT_P12_BASE64 is not set; keeping ad-hoc signature"
            exit 0
          fi
          bin="target/${{ matrix.target }}/release/agentdeckd"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          cert="$RUNNER_TEMP/cert.p12"
          password="$(uuidgen)"
          sign() {
            echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$cert" &&
            security create-keychain -p "$password" "$keychain" &&
            security set-keychain-settings -lut 21600 "$keychain" &&
            security unlock-keychain -p "$password" "$keychain" &&
            security import "$cert" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign &&
            security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null &&
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"') &&
            identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')" &&
            [ -n "$identity" ] &&
            codesign --force --sign "$identity" --identifier com.agentdeck.daemon --timestamp "$bin" &&
            codesign --verify --strict "$bin"
          }
          if ! sign; then
            echo "::warning::Developer ID signing failed; keeping ad-hoc signature"
          fi
          rm -f "$cert"
          codesign -dv "$bin" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Signature)'

      - name: Package archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="agentdeckd-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "${name}.tar.gz" agentdeckd
          shasum -a 256 "${name}.tar.gz" | awk '{print $1}' > "${name}.tar.gz.sha256"

      - name: Package archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "agentdeckd-${{ matrix.target }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/agentdeckd.exe" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$name.zip.sha256" -Value $hash -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: agentdeckd-${{ matrix.target }}
          path: |
            agentdeckd-${{ matrix.target }}.tar.gz
            agentdeckd-${{ matrix.target }}.tar.gz.sha256
            agentdeckd-${{ matrix.target }}.zip
            agentdeckd-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore

  pack-npm:
    name: Package and verify npm distribution
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: agentdeckd-*
          path: artifacts
          merge-multiple: true

      - name: Test npm packaging and launcher
        run: node --test crates/daemon/npm/distribution.test.mjs

      - name: Package release binaries
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=0.0.0-dev
          if [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            version="${RELEASE_TAG#v}"
          fi
          node crates/daemon/npm/build.mjs "$version" artifacts dist/npm

      - name: Verify global install with Linux release binary
        run: node crates/daemon/npm/verify.mjs dist/npm

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: |
            dist/npm/*.tgz
            dist/npm/publish.json
          if-no-files-found: error

  publish-npm:
    name: Publish npm packages (OIDC)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [pack-npm, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/npm

      - name: Publish platform packages, then entry package
        run: node crates/daemon/npm/publish.mjs dist/npm

  build-extension:
    name: Build Browser Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync manifest version from tag and strip key
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
            echo "Setting extension manifest version from tag to $version"
            jq --arg v "$version" '.version = $v | del(.key)' packages/extension/manifest.json > packages/extension/manifest.tmp && mv packages/extension/manifest.tmp packages/extension/manifest.json
          else
            jq 'del(.key)' packages/extension/manifest.json > packages/extension/manifest.tmp && mv packages/extension/manifest.tmp packages/extension/manifest.json
          fi

      - name: Build extensions
        run: pnpm --filter agentdeck-extension build --browser chrome,firefox --zip

      - name: Rename extension archives
        run: |
          mv packages/extension/dist/chrome/*.zip packages/extension/dist/chrome/extension-chrome.zip
          mv packages/extension/dist/firefox/*.zip packages/extension/dist/firefox/extension-firefox.zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension-chrome-zip
          path: packages/extension/dist/chrome/extension-chrome.zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension-firefox-zip
          path: packages/extension/dist/firefox/extension-firefox.zip

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-rust, build-extension, pack-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/**/*

  bump-packages:
    needs: [release]
    uses: ./.github/workflows/bump-packages.yml
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}

  publish-chrome:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-chrome-zip

      - uses: wdzeng/chrome-extension@v1
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip-path: '*.zip'
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-edge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-chrome-zip

      - uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: '*.zip'
          api-key: ${{ secrets.EDGE_API_KEY }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}

  publish-firefox:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-firefox-zip

      - uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: ${{ secrets.FIREFOX_ADDON_GUID }}
          xpi-path: '*.zip'
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
