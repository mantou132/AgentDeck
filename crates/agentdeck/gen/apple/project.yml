name: agentdeck
options:
  bundleIdPrefix: com.mantou.agentdeck
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: AgentDeck
      PRODUCT_BUNDLE_IDENTIFIER: com.mantou.agentdeck
      DEVELOPMENT_TEAM: L42P5Q9798
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  agentdeck_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: agentdeck_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: agentdeck_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # Opened by the share extension to bring the app to the front
        CFBundleURLTypes:
          - CFBundleURLName: com.mantou.agentdeck
            CFBundleURLSchemes: [agentdeck]
    entitlements:
      path: agentdeck_iOS/agentdeck_iOS.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.mantou.agentdeck]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: agentdeck_ShareExtension
      - target: agentdeck_WidgetExtension
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    postBuildScripts:
      # tauri builds with signing disabled and restores only the app's entitlements before export;
      # signing the embedded extensions here keeps their App Group in the exported IPA.
      - script: |
          if [ "$CODE_SIGNING_ALLOWED" = "NO" ]; then
            for name in ShareExtension WidgetExtension; do
              codesign --force --sign - --entitlements "$SRCROOT/$name/$name.entitlements" "$TARGET_BUILD_DIR/$PLUGINS_FOLDER_PATH/agentdeck_$name.appex"
            done
          fi
        name: Keep Extension Entitlements
        basedOnDependencyAnalysis: false
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a  # Receives shared content, see `crates/agentdeck/src/share.rs`. Not named `*_iOS`: tauri treats that target as the app.
  agentdeck_ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: AgentDeck
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mantou.agentdeck]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mantou.agentdeck.share
        DEVELOPMENT_TEAM: L42P5Q9798
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    preBuildScripts:
      # tauri only writes the version into the app's Info.plist; the store requires the extension to match.
      - script: |
          plist="${SRCROOT}/agentdeck_iOS/Info.plist"
          for key in CFBundleShortVersionString CFBundleVersion; do
            /usr/libexec/PlistBuddy -c "Set :$key $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")" "${SRCROOT}/${INFOPLIST_FILE}"
          done
        name: Sync App Version
        inputFiles: [$(SRCROOT)/agentdeck_iOS/Info.plist]
        # Declared so the Info.plist processing waits for it
        outputFiles: [$(SRCROOT)/ShareExtension/Info.plist]
        basedOnDependencyAnalysis: false
  # Home screen widget opening apps saved by `crates/agentdeck/src/saved_apps.rs`.
  agentdeck_WidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: AgentDeck
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetExtension/WidgetExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mantou.agentdeck]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mantou.agentdeck.widget
        DEVELOPMENT_TEAM: L42P5Q9798
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # AppIntentConfiguration and containerBackground
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    preBuildScripts:
      # tauri only writes the version into the app's Info.plist; the store requires the extension to match.
      - script: |
          plist="${SRCROOT}/agentdeck_iOS/Info.plist"
          for key in CFBundleShortVersionString CFBundleVersion; do
            /usr/libexec/PlistBuddy -c "Set :$key $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")" "${SRCROOT}/${INFOPLIST_FILE}"
          done
        name: Sync App Version
        inputFiles: [$(SRCROOT)/agentdeck_iOS/Info.plist]
        outputFiles: [$(SRCROOT)/WidgetExtension/Info.plist]
        basedOnDependencyAnalysis: false
