[package]
name = "agentdeck"
version = "0.1.0"
description = "A focused mobile ACP client built with Tauri"
authors = ["AgentDeck contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-edge-to-edge = { git = "https://github.com/mantou132/tauri-plugin-edge-to-edge" }
tauri-plugin-webproxy = { git = "https://github.com/mantou132/tauri-plugin-webproxy" }
tauri-plugin-vnidrop-share = "1.0.0-rc"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"
tauri-plugin-fcm = { git = "https://github.com/mantou132/tauri-plugin-fcm" }
tauri-plugin-barcode-scanner = "2"
tauri-plugin-selection-menu = { git = "https://github.com/mantou132/tauri-plugin-selection-menu" }
tauri-plugin-stt = "0.2"
tauri-plugin-tts = "0.2"
tauri-plugin-add-to-calendar = { git = "https://github.com/mantou132/tauri-plugin-add-to-calendar" }
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-pin-shortcut = { git = "https://github.com/mantou132/tauri-plugin-pin-shortcut" }

[target.'cfg(target_os = "ios")'.dependencies]
# App Group container shared with the extensions; push taps posted by tauri-plugin-fcm
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSFileManager", "NSNotification", "NSOperation", "NSString", "NSURL"] }
block2 = "0.6"
